<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنيو الذكي</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #ff9900;
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 80px;
        }
        .restaurant-header {
            text-align: center;
            padding: 30px 15px 20px;
            background: linear-gradient(180deg, rgba(255,153,0,0.15) 0%, rgba(15,15,15,1) 100%);
            border-bottom: 1px solid #2a2a2a;
        }
        .restaurant-logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-color);
            margin-bottom: 12px;
        }
        .category-scroll {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            padding: 12px 10px;
            background-color: #141414;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #222;
        }
        .category-scroll::-webkit-scrollbar { display: none; }
        .category-btn {
            background: #222;
            color: #fff;
            border: 1px solid #333;
            padding: 8px 18px;
            margin-left: 8px;
            border-radius: 20px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .category-btn.active {
            background: var(--primary-color);
            color: #000;
            font-weight: bold;
            border-color: var(--primary-color);
        }
        .menu-card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid #262626;
            margin-bottom: 15px;
            overflow: hidden;
            display: flex;
        }
        .menu-card-img {
            width: 110px;
            height: 110px;
            object-fit: cover;
        }
        .menu-card-body {
            padding: 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .menu-card-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .menu-card-desc {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .price-tag {
            color: var(--primary-color);
            font-weight: bold;
            font-size: 15px;
        }
        .add-btn {
            background: var(--primary-color);
            color: #000;
            border: none;
            padding: 4px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
        }
        .cart-bar {
            position: fixed;
            bottom: 15px;
            left: 15px;
            right: 15px;
            background: var(--primary-color);
            color: #000;
            padding: 12px 20px;
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255,153,0,0.4);
            z-index: 999;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="app">
        <div class="text-center py-5">
            <div class="spinner-border text-warning" role="status"></div>
            <p class="mt-2">جاري تحميل المنيو...</p>
        </div>
    </div>

    <!-- شريط السلة السفلي -->
    <div id="cartBar" class="cart-bar d-none" onclick="sendOrderWhatsApp()">
        <span><i class="fa-solid fa-cart-shopping me-2"></i> إرسال الطلب (<span id="cartCount">0</span>)</span>
        <span id="cartTotal">0 ج.م</span>
    </div>

    <script>
        let restaurantData = null;
        let cart = {};

        // 1. تحديد المطعم تلقائياً مع خيار افتراضي ibn-masr
        const urlParams = new URLSearchParams(window.location.search);
        const restaurantId = urlParams.get('res') || 'ibn-masr';

        // 2. جلب البيانات
        fetch(`${restaurantId}.json`)
            .then(res => {
                if(!res.ok) throw new Error('تعذر تحميل البيانات');
                return res.json();
            })
            .then(data => {
                restaurantData = data;
                renderApp();
            })
            .catch(err => {
                // محاولة ثانية لتحميل ibn-masr مباشرة حالة حدوث أي خطأ
                fetch('ibn-masr.json')
                    .then(res => res.json())
                    .then(data => {
                        restaurantData = data;
                        renderApp();
                    })
                    .catch(() => {
                        document.getElementById('app').innerHTML = `
                            <div class="text-center py-5 text-danger">
                                <h3>عذراً، حدث خطأ في تحميل المنيو</h3>
                                <p>يرجى التاكد من الرابط أو محاولة التحديث مرة أخرى.</p>
                            </div>
                        `;
                    });
            });

        function renderApp() {
            const app = document.getElementById('app');
            document.title = restaurantData.restaurantName || 'المنيو الذكي';

            let categoriesHTML = `<div class="category-scroll">`;
            restaurantData.categories.forEach((cat, index) => {
                categoriesHTML += `<button class="category-btn ${index === 0 ? 'active' : ''}" onclick="scrollToCategory('${cat.id}', this)">${cat.name}</button>`;
            });
            categoriesHTML += `</div>`;

            let itemsHTML = `<div class="container mt-3">`;
            restaurantData.categories.forEach(cat => {
                itemsHTML += `<h5 id="${cat.id}" class="mt-4 mb-3 text-warning border-bottom border-secondary pb-2">${cat.name}</h5>`;
                cat.items.forEach(item => {
                    itemsHTML += `
                        <div class="menu-card">
                            <img src="${item.image || 'https://via.placeholder.com/150'}" class="menu-card-img" alt="${item.name}">
                            <div class="menu-card-body">
                                <div>
                                    <div class="menu-card-title">${item.name}</div>
                                    <div class="menu-card-desc">${item.description || ''}</div>
                                </div>
                                <div class="d-flex justify-content-between align-items-center">
                                    <span class="price-tag">${item.price} ج.م</span>
                                    <button class="add-btn" onclick="addToCart('${item.id}', '${item.name}', ${item.price})">+ إضافة</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            });
            itemsHTML += `</div>`;

            app.innerHTML = `
                <div class="restaurant-header">
                    <img src="${restaurantData.logo || 'https://via.placeholder.com/100'}" class="restaurant-logo" alt="logo">
                    <h4>${restaurantData.restaurantName}</h4>
                    <p class="text-muted small mb-0">${restaurantData.address || ''}</p>
                </div>
                ${categoriesHTML}
                ${itemsHTML}
            `;
        }

        function scrollToCategory(catId, btn) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const el = document.getElementById(catId);
            if (el) el.scrollIntoView({ behavior: 'smooth' });
        }

        function addToCart(id, name, price) {
            if (!cart[id]) cart[id] = { name, price, qty: 0 };
            cart[id].qty++;
            updateCartUI();
        }

        function updateCartUI() {
            let total = 0;
            let count = 0;
            for (let id in cart) {
                total += cart[id].price * cart[id].qty;
                count += cart[id].qty;
            }
            const cartBar = document.getElementById('cartBar');
            if (count > 0) {
                cartBar.classList.remove('d-none');
                document.getElementById('cartCount').innerText = count;
                document.getElementById('cartTotal').innerText = total + ' ج.م';
            } else {
                cartBar.classList.add('d-none');
            }
        }

        function sendOrderWhatsApp() {
            let message = `طلب جديد من المنيو الإلكتروني - ${restaurantData.restaurantName}:\n\n`;
            let total = 0;
            for (let id in cart) {
                let item = cart[id];
                let subtotal = item.price * item.qty;
                total += subtotal;
                message += `• ${item.name} x ${item.qty} = ${subtotal} ج.م\n`;
            }
            message += `\nإجمالي الطلب: ${total} ج.م`;
            
            const phone = restaurantData.whatsapp || '201000000000';
            const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
